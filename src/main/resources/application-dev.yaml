server:
  port: 8081

logging:
  level:
    root: info
    org.springframework: debug
    org.springframework.security: debug
    org.springframework.oauth2: debug

spring:

  datasource:
    url: jdbc:h2:mem:pharmacash;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    locations: classpath:db/migration/postgres
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pharma-cash-keycloak

      client:
        registration:
          keycloak:
            client-secret: "**********"
        provider:
          pharma-cash-keycloak:
            issuer-uri: http://localhost:8080/realms/pharma-cash-keycloak

